[package]
name = "prystan"
version = "0.1.0"
description = "Prystan — Docker і сервери в одному вікні"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = "0.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "net", "process"] }
futures-util = "0.3"
base64 = "0.22"
tar = "0.4"
regex = "1"
portable-pty = "0.9"
keyring = { version = "3", features = ["windows-native"] }
ureq = { version = "2", features = ["tls"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
