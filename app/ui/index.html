<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<title>Prystan</title>
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="vendor/xterm.css" />
<link rel="stylesheet" href="vendor/cm/codemirror.css" />
<link rel="stylesheet" href="vendor/cm/material-darker.css" />
</head>
<body>
  <header>
    <div class="logo" data-icon="anchor">Pry<span>stan</span></div>
    <button id="palette-btn" class="ghost" data-icon="search" data-i18n-title="app.palette.title"><span data-i18n="app.palette">Ctrl+K</span></button>
    <div class="spacer"></div>
    <span class="badge" id="fwd-badge" style="display:none" data-icon="plug" data-i18n-title="app.tunnels"><b id="fwd-count">0</b></span>
    <span class="badge upd" id="update-badge" style="display:none" data-icon="download"><span data-i18n="upd.new"></span></span>
    <button id="settings-btn" class="ghost" data-icon="settings" data-i18n-title="set.title"></button>
    <select id="lang-sel" class="ghost-sel" data-i18n-title="app.lang">
      <option value="uk">Українська</option>
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
    <button id="theme-btn" class="ghost" data-icon="moon" data-i18n-title="app.theme"></button>
    <div class="meta" id="engine"></div>
    <div class="badge" id="perf"></div>
  </header>

  <div class="loadbar" id="loadbar"></div>

  <main>
    <div id="left">
      <div id="connbox"></div>
      <div id="projbox"></div>
      <div class="bar">
        <input id="filter" data-i18n-ph="app.filter" />
        <button id="refresh" data-icon="rotate" data-i18n-title="app.refresh"></button>
      </div>
      <div class="bar" id="quickbar">
        <div class="seg" id="quick-filter">
          <button data-q="all" class="on" data-icon="list" data-i18n-title="quick.all"></button>
          <button data-q="running" data-icon="play" data-i18n-title="quick.running"></button>
          <button data-q="stopped" data-icon="stop" data-i18n-title="quick.stopped"></button>
          <button data-q="unhealthy" data-icon="alert" data-i18n-title="quick.problem"></button>
        </div>
        <span style="flex:1"></span>
        <button id="bulk-toggle" class="ghost" data-icon="checkSquare" data-i18n-title="bulk.toggle"></button>
      </div>
      <div id="tree"></div>
      <div id="bulkbar" style="display:none">
        <span id="bulk-count">0</span>
        <span style="flex:1"></span>
        <button data-b="start" data-icon="play" data-i18n-title="bulk.start"></button>
        <button data-b="stop" data-icon="stop" data-i18n-title="bulk.stop"></button>
        <button data-b="restart" data-icon="rotate" data-i18n-title="bulk.restart"></button>
        <button data-b="rm" class="danger" data-icon="trash" data-i18n-title="bulk.rm"></button>
      </div>
    </div>

    <div id="resizer" data-i18n-title="keys.resize"></div>

    <div id="right">
      <div id="detail-header"></div>
      <div id="tabs" style="display:none"></div>
      <div id="content">
        <div id="welcome"></div>

        <div class="pane" id="pane-logs">
          <div class="toolbar">
            <input id="log-search" data-i18n-ph="logs.search" style="width:220px" />
            <span id="log-matches" class="hint" style="min-width:70px"></span>
            <div class="seg" id="log-level">
              <button data-lvl="all" class="on" data-icon="list" data-i18n-title="quick.all"></button>
              <button data-lvl="warn" class="warnbtn" data-icon="alert"><span id="cnt-warn">0</span></button>
              <button data-lvl="err" class="errbtn" data-icon="error"><span id="cnt-err">0</span></button>
            </div>
            <button id="log-deep" data-icon="search" data-i18n-title="logs.deep"></button>
            <select id="log-tail">
              <option value="500">500</option>
              <option value="2000">2000</option>
              <option value="10000">10000</option>
            </select>
            <span style="flex:1"></span>
            <button id="log-wrap" data-icon="wrapText" data-i18n-title="logs.wrap"></button>
            <button id="log-follow" data-icon="pause" data-i18n-title="logs.follow"></button>
            <button id="log-clear" data-icon="eraser" data-i18n-title="logs.clear"></button>
            <button id="log-export" data-icon="download" data-i18n-title="logs.export"></button>
          </div>
          <div id="logs"></div>
        </div>

        <div class="pane" id="pane-files">
          <div class="toolbar" style="flex-wrap:nowrap">
            <button id="fs-up" data-icon="arrowUp" data-i18n-title="files.up"></button>
            <input id="fs-path" class="mono-input" style="flex:1;min-width:120px" spellcheck="false" data-i18n-title="files.path" />
            <button id="fs-copy" data-icon="clipboard" data-i18n-title="files.copy"></button>
            <input id="fs-filter" data-i18n-ph="files.filter" style="width:120px" />
            <button id="fs-refresh" data-icon="rotate" data-i18n-title="common.refresh"></button>
            <button id="fs-mkdir" data-icon="folderPlus" data-i18n-title="files.mkdir"></button>
            <button id="fs-find" data-icon="search" data-i18n-title="find.title"></button>
            <button id="fs-du" data-icon="pieChart" data-i18n-title="du.title"></button>
            <button id="fs-upload-btn" data-icon="upload" data-i18n-title="files.upload"></button>
            <input type="file" id="fs-upload-input" multiple style="display:none" />
          </div>
          <div id="files-table"></div>
          <div id="drop-hint" data-i18n="files.drop"></div>
        </div>

        <div class="pane" id="pane-term">
          <div class="toolbar">
            <div id="term-tabs"></div>
            <button id="term-new" data-icon="plus" data-i18n-title="term.new"></button>
            <select id="term-shell" data-i18n-title="term.shell">
              <option value="/bin/bash" selected>bash</option>
              <option value="/bin/sh">sh</option>
              <option value="/bin/ash">ash</option>
              <option value="/bin/zsh">zsh</option>
            </select>
            <span style="flex:1"></span>
            <select id="term-snippets"></select>
            <button id="term-snip-save" data-icon="save" data-i18n-title="term.snipSave"></button>
            <button id="term-suggest" data-icon="lightbulb" data-i18n-title="term.suggest"></button>
            <input id="term-search" data-i18n-ph="term.search" style="width:150px" />
          </div>
          <div id="term-wrap">
            <div id="term-container"></div>
            <div id="term-complete"></div>
            <div id="term-overlay">
              <div class="hint" data-i18n="term.closed"></div>
              <button id="term-restart" class="primary" data-i18n="term.new"></button>
            </div>
          </div>
        </div>

        <div class="pane" id="pane-inspect"><div id="inspect"></div></div>

        <div class="pane" id="pane-compose">
          <div class="toolbar">
            <button id="cm-up" class="primary" data-icon="play"><span data-i18n="compose.up"></span></button>
            <button id="cm-build" data-icon="hammer"><span data-i18n="compose.build"></span></button>
            <button id="cm-restart" data-icon="rotate"><span data-i18n="compose.restart"></span></button>
            <button id="cm-pull" data-icon="download"><span data-i18n="compose.pull"></span></button>
            <button id="cm-down" class="danger" data-icon="stop"><span data-i18n="compose.down"></span></button>
            <span style="flex:1"></span>
            <button id="cm-edit-compose" data-icon="file"><span data-i18n="compose.editCompose"></span></button>
            <button id="cm-edit-env" data-icon="key"><span data-i18n="compose.editEnv"></span></button>
          </div>
          <div id="cm-workdir" class="hint" style="padding:6px 12px"></div>
          <div id="cm-output"></div>
        </div>

        <div class="pane" id="pane-images">
          <div class="toolbar">
            <input id="pull-name" data-i18n-ph="res.pullPlaceholder" style="width:240px" />
            <button id="pull-btn" class="primary" data-icon="download"><span>pull</span></button>
            <button id="build-btn" data-icon="hammer"><span data-i18n="res.build"></span></button>
            <button id="create-btn" data-icon="plus"><span data-i18n="res.newContainer"></span></button>
            <button id="registry-btn" data-icon="key"><span data-i18n="reg.title"></span></button>
            <span style="flex:1"></span>
            <button id="prune-images" class="danger" data-icon="trash"><span data-i18n="res.prune"></span></button>
          </div>
          <div class="respane" id="images-table"></div>
          <div id="pull-log"></div>
        </div>

        <div class="pane" id="pane-volumes">
          <div class="toolbar"><span style="flex:1"></span><button id="prune-volumes" class="danger" data-icon="trash"><span data-i18n="res.prune"></span></button></div>
          <div class="respane" id="volumes-table"></div>
        </div>

        <div class="pane" id="pane-networks"><div class="respane" id="networks-table"></div></div>
        <div class="pane" id="pane-df"><div class="respane" id="df-body" style="padding:16px"></div></div>
        <div class="pane" id="pane-srv-stats"><div class="respane" id="srv-stats" style="padding:16px"></div></div>

        <div class="pane" id="pane-srv-proc">
          <div class="toolbar">
            <input id="proc-filter" data-i18n-ph="srv.procFilter" style="width:200px" />
            <select id="proc-sort">
              <option value="cpu" data-i18n="srv.byCpu"></option>
              <option value="mem" data-i18n="srv.byMem"></option>
            </select>
            <span style="flex:1"></span>
            <span id="proc-updated" class="hint"><span class="livedot"></span> live</span>
          </div>
          <div class="respane" id="proc-table"></div>
        </div>

        <!-- аналіз використання диска по теках -->
        <div class="pane" id="pane-du">
          <div class="toolbar" style="flex-wrap:nowrap">
            <button id="du-up" data-icon="arrowUp" data-i18n-title="files.up"></button>
            <input id="du-path" class="mono-input" style="flex:1;min-width:120px" spellcheck="false" />
            <button id="du-go" class="primary" data-icon="pieChart"><span data-i18n="du.scan"></span></button>
            <span id="du-total" class="hint"></span>
          </div>
          <div class="respane" id="du-body"></div>
        </div>

        <!-- навантаження по всіх контейнерах -->
        <div class="pane" id="pane-top"><div class="respane" id="top-table"></div></div>

        <div class="pane" id="pane-dash"><div class="respane" id="dash-body" style="padding:16px"></div></div>

        <!-- журнал дій -->
        <div class="pane" id="pane-journal">
          <div class="toolbar">
            <input id="jr-filter" data-i18n-ph="files.filter" style="width:200px" />
            <span style="flex:1"></span>
            <span id="jr-count" class="hint"></span>
            <button id="jr-refresh" data-icon="rotate" data-i18n-title="common.refresh"></button>
            <button id="jr-clear" class="danger" data-icon="eraser"><span data-i18n="logs.clear"></span></button>
          </div>
          <div class="respane" id="jr-table"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span><span id="eventlight"></span><span id="lastevent" data-i18n="events.waiting"></span></span>
    <span id="count"></span>
    <span style="margin-left:auto"><span id="ro-badge" class="badge ro" style="display:none" data-icon="lock"><span data-i18n="app.readonly"></span></span> Tauri 2 · Rust · bollard</span>
  </footer>

  <div class="modal-back" id="palette-modal">
    <div class="modal" style="width:620px;align-self:flex-start;margin-top:12vh">
      <div class="mbody" style="padding:0">
        <div style="display:flex;align-items:center">
          <input id="palette-input" data-i18n-ph="pal.placeholder" style="flex:1;border:none;border-radius:0;padding:14px 16px;font-size:14px" />
          <span class="x" data-icon="x" data-close="palette-modal" data-i18n-title="editor.close" style="padding:0 14px;cursor:pointer;color:var(--dim)"></span>
        </div>
        <div id="palette-list"></div>
        <div class="hint" style="padding:6px 16px;border-top:1px solid var(--border)" data-i18n="pal.hints"></div>
      </div>
    </div>
  </div>

  <div class="modal-back" id="conn-modal">
    <div class="modal" style="width:600px">
      <div class="mhead"><span data-i18n="conn.title"></span> <span class="x" data-icon="x" data-close="conn-modal"></span></div>
      <div class="mbody">
        <div class="plist" id="profile-list"></div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button id="import-contexts" data-i18n="conn.import"></button>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:12px">
          <div style="font-weight:600;margin-bottom:10px" id="pf-title"></div>
          <div class="form-grid">
            <label data-i18n="conn.name"></label><input id="pf-name" />
            <label data-i18n="conn.type"></label>
            <select id="pf-kind"><option value="ssh">SSH</option><option value="tcp">TCP</option></select>
            <label id="l-host" data-i18n="conn.host"></label><input id="pf-host" placeholder="168.119.96.236" />
            <label id="l-port" data-i18n="conn.port"></label><input id="pf-port" style="width:100px" />
            <label id="l-user" data-i18n="conn.user"></label><input id="pf-user" placeholder="root" />
            <label id="l-key" data-i18n="conn.key"></label><input id="pf-key" data-i18n-ph="conn.keyHint" />
            <label data-i18n="conn.protect"></label>
            <label style="color:var(--text);display:flex;gap:8px;align-items:center;font-size:12px">
              <input type="checkbox" id="pf-readonly" style="width:auto" /> <span data-i18n="conn.readonlyLabel"></span>
            </label>
          </div>
        </div>
      </div>
      <div class="mfoot">
        <button data-close="conn-modal" data-i18n="conn.cancel"></button>
        <button id="pf-save" class="primary" data-i18n="conn.save"></button>
      </div>
    </div>
  </div>

  <div class="modal-back" id="create-modal">
    <div class="modal" style="width:600px">
      <div class="mhead"><span data-i18n="create.title"></span> <span class="x" data-icon="x" data-close="create-modal"></span></div>
      <div class="mbody">
        <div class="form-grid">
          <label data-i18n="create.image"></label><input id="cr-image" placeholder="redis:7-alpine" />
          <label data-i18n="create.name"></label><input id="cr-name" placeholder="my-redis" />
          <label data-i18n="create.ports"></label><input id="cr-ports" placeholder="8080:80, 5432:5432" />
          <label data-i18n="create.volumes"></label><input id="cr-vols" placeholder="/data:/var/lib/data" />
          <label data-i18n="create.env"></label><input id="cr-env" placeholder="KEY=value, OTHER=1" />
          <label data-i18n="create.cmd"></label><input id="cr-cmd" data-i18n-ph="create.cmdHint" />
          <label data-i18n="create.restart"></label>
          <select id="cr-restart">
            <option value="no">no</option>
            <option value="unless-stopped">unless-stopped</option>
            <option value="always">always</option>
            <option value="on-failure">on-failure</option>
          </select>
          <label data-i18n="create.start"></label>
          <label style="color:var(--text);display:flex;gap:8px;align-items:center;font-size:12px">
            <input type="checkbox" id="cr-start" checked style="width:auto" /> <span data-i18n="create.startNow"></span>
          </label>
        </div>
        <div class="hint" style="margin-top:12px" data-i18n="create.equivalent"></div>
        <pre id="cr-preview" class="cmdprev"></pre>
      </div>
      <div class="mfoot">
        <button data-close="create-modal" data-i18n="conn.cancel"></button>
        <button id="cr-go" class="primary" data-i18n="create.go"></button>
      </div>
    </div>
  </div>

  <div class="modal-back" id="build-modal">
    <div class="modal" style="width:640px">
      <div class="mhead"><span data-i18n="build.title"></span> <span class="x" data-icon="x" data-close="build-modal"></span></div>
      <div class="mbody">
        <div class="form-grid">
          <label data-i18n="build.dir"></label><input id="bd-dir" class="mono-input" placeholder="E:\proj\myapp" />
          <label data-i18n="build.file"></label><input id="bd-file" placeholder="Dockerfile" />
          <label data-i18n="build.tag"></label><input id="bd-tag" placeholder="myapp:dev" />
        </div>
        <div class="hint" style="margin-top:10px" data-i18n="build.hint"></div>
        <div id="bd-output"></div>
      </div>
      <div class="mfoot">
        <button data-close="build-modal" data-i18n="editor.close"></button>
        <button id="bd-go" class="primary" data-i18n="build.go"></button>
      </div>
    </div>
  </div>

  <div class="modal-back" id="deep-modal">
    <div class="modal" style="width:80vw;height:80vh">
      <div class="mhead">
        <span data-i18n="deep.title"></span> <span id="deep-target" class="hint"></span>
        <span class="x" data-icon="x" data-close="deep-modal"></span>
      </div>
      <div class="mbody" style="display:flex;flex-direction:column;gap:0;padding:0">
        <div class="toolbar">
          <input id="deep-q" data-i18n-ph="deep.q" style="flex:1" />
          <label class="chk"><input type="checkbox" id="deep-re" /> regex</label>
          <label class="chk"><input type="checkbox" id="deep-cs" /> Aa</label>
          <select id="deep-since">
            <option value="" data-i18n="deep.all"></option>
            <option value="3600" data-i18n="deep.hour"></option>
            <option value="86400" data-i18n="deep.day"></option>
            <option value="604800" data-i18n="deep.week"></option>
          </select>
          <button id="deep-go" class="primary" data-i18n="deep.go"></button>
        </div>
        <div id="deep-stat" class="hint" style="padding:6px 12px"></div>
        <div id="deep-results"></div>
      </div>
    </div>
  </div>

  <div class="modal-back" id="ask-modal">
    <div class="modal" style="width:440px">
      <div class="mhead" id="ask-title"></div>
      <div class="mbody">
        <div id="ask-text" style="user-select:text"></div>
        <input id="ask-input" style="width:100%;margin-top:10px;display:none" />
      </div>
      <div class="mfoot">
        <button id="ask-no" data-i18n="common.cancel"></button>
        <button id="ask-yes" class="primary" data-i18n="common.ok"></button>
      </div>
    </div>
  </div>

  <div class="modal-back" id="editor-modal">
    <div class="modal">
      <div class="mhead" style="gap:10px">
        <span id="editor-dirty" class="dirtydot" style="display:none" data-i18n-title="editor.dirty"></span>
        <span id="editor-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%"></span>
        <input id="editor-search" data-i18n-ph="editor.search" style="flex:1;max-width:240px;margin-left:auto" />
        <span id="editor-search-cnt" class="hint" style="min-width:56px"></span>
        <button id="editor-dock" data-icon="grid" data-i18n-title="set.dock"></button>
        <button id="editor-prev" data-icon="chevronDown" class="flipy" data-i18n-title="editor.prev"></button>
        <button id="editor-next" data-icon="chevronDown" data-i18n-title="editor.next"></button>
        <span class="x" id="editor-close" data-icon="x"></span>
      </div>
      <div class="mbody"><textarea id="editor-ta"></textarea></div>
      <div class="mfoot">
        <span id="editor-note"></span>
        <label class="chk" data-i18n-title="editor.backup"><input type="checkbox" id="editor-backup" checked /> .bak</label>
        <button id="editor-download" data-i18n="editor.toDisk"></button>
        <button id="editor-save" class="primary" data-i18n="editor.save"></button>
      </div>
    </div>
  </div>

  <!-- шари образу -->
  <div class="modal-back" id="layers-modal">
    <div class="modal" style="width:82vw;max-height:82vh">
      <div class="mhead"><span data-i18n="img.layers"></span> <span id="layers-title" class="hint"></span>
        <span class="x" data-icon="x" data-close="layers-modal"></span></div>
      <div class="mbody" style="padding:0"><div id="layers-body"></div></div>
    </div>
  </div>

  <!-- сканування вразливостей -->
  <div class="modal-back" id="scan-modal">
    <div class="modal" style="width:86vw;height:84vh">
      <div class="mhead"><span data-i18n="scan.title"></span> <span id="scan-title" class="hint"></span>
        <span class="x" data-icon="x" data-close="scan-modal"></span></div>
      <div class="mbody" style="padding:0;display:flex;flex-direction:column">
        <div id="scan-summary" style="padding:10px 14px"></div>
        <div class="toolbar" id="scan-tools" style="display:none">
          <input id="scan-filter" data-i18n-ph="files.filter" style="width:200px" />
          <div class="seg" id="scan-sev">
            <button data-s="all" class="on" data-i18n="quick.all"></button>
            <button data-s="CRITICAL">CRITICAL</button>
            <button data-s="HIGH">HIGH</button>
            <button data-s="fix" data-i18n="scan.fixable"></button>
          </div>
        </div>
        <div id="scan-body" style="flex:1;overflow:auto"></div>
      </div>
    </div>
  </div>

  <!-- реєстри -->
  <div class="modal-back" id="registry-modal">
    <div class="modal" style="width:560px">
      <div class="mhead"><span data-i18n="reg.title"></span> <span class="x" data-icon="x" data-close="registry-modal"></span></div>
      <div class="mbody">
        <div class="plist" id="registry-list"></div>
        <div style="border-top:1px solid var(--border);padding-top:12px">
          <div class="form-grid">
            <label data-i18n="reg.server"></label><input id="rg-server" placeholder="ghcr.io / registry.gitlab.com / docker.io" />
            <label data-i18n="conn.user"></label><input id="rg-user" />
            <label data-i18n="reg.password"></label><input id="rg-pass" type="password" placeholder="token" />
          </div>
          <div class="hint" style="margin-top:8px" data-i18n="reg.hint"></div>
        </div>
      </div>
      <div class="mfoot">
        <button data-close="registry-modal" data-i18n="conn.cancel"></button>
        <button id="rg-save" class="primary" data-i18n="conn.save"></button>
      </div>
    </div>
  </div>

  <!-- налаштування (Telegram) -->
  <div class="modal-back" id="settings-modal">
    <div class="modal" style="width:560px">
      <div class="mhead"><span data-i18n="set.title"></span> <span class="x" data-icon="x" data-close="settings-modal"></span></div>
      <div class="mbody">
        <div class="sechead" data-icon="settings"><span data-i18n="set.general"></span></div>
        <div class="form-grid">
          <label data-i18n="set.pollFast"></label>
          <select id="cfg-poll">
            <option value="2">2 c</option>
            <option value="4">4 c</option>
            <option value="10">10 c</option>
            <option value="0" data-i18n="set.off"></option>
          </select>
          <label data-i18n="set.bgMonitor"></label>
          <select id="cfg-bgmon">
            <option value="15">15 c</option>
            <option value="30">30 c</option>
            <option value="60">60 c</option>
            <option value="0" data-i18n="set.off"></option>
          </select>
          <label data-i18n="set.logBuffer"></label>
          <select id="cfg-logbuf">
            <option value="2000">2000</option>
            <option value="8000">8000</option>
            <option value="20000">20000</option>
          </select>
          <label data-i18n="term.shell"></label>
          <select id="cfg-shell">
            <option value="/bin/bash">bash</option>
            <option value="/bin/sh">sh</option>
            <option value="/bin/ash">ash</option>
            <option value="/bin/zsh">zsh</option>
          </select>
        </div>
        <div style="margin-top:10px;display:grid;gap:7px">
          <label class="chk"><input type="checkbox" id="cfg-confirm" /> <span data-i18n="set.confirm"></span></label>
          <label class="chk"><input type="checkbox" id="cfg-dock" /> <span data-i18n="set.dock"></span></label>
          <label class="chk"><input type="checkbox" id="cfg-upd" /> <span data-i18n="set.checkUpd"></span></label>
          <label class="chk"><input type="checkbox" id="cfg-demo" /> <span data-i18n="set.demo"></span></label>
        </div>
        <div class="hint" style="margin-top:6px" data-i18n="set.demoHint"></div>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
          <button id="cfg-check-now" data-icon="download"><span data-i18n="upd.check"></span></button>
          <span id="cfg-upd-state" class="hint"></span>
        </div>

        <div class="sechead" style="margin-top:18px" data-icon="send"><span data-i18n="set.telegram"></span></div>
        <div class="form-grid">
          <label data-i18n="set.token"></label><input id="tg-token" type="password" placeholder="123456:AA..." />
          <label>chat_id</label>
          <div style="display:flex;gap:8px">
            <input id="tg-chat" style="flex:1" placeholder="-1001234567890" />
            <button id="tg-detect" data-icon="search"><span data-i18n="set.detect"></span></button>
          </div>
        </div>
        <div class="hint" style="margin-top:8px" data-i18n="set.tgHint"></div>
        <div id="tg-detect-state" class="hint" style="display:none;margin-top:8px"></div>
        <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
          <button id="tg-save" class="primary" data-icon="save"><span data-i18n="conn.save"></span></button>
          <button id="tg-test" data-icon="send"><span data-i18n="set.test"></span></button>
          <button id="tg-forget" class="danger" data-icon="trash"><span data-i18n="set.forget"></span></button>
          <span id="tg-state" class="hint"></span>
        </div>
        <div style="border-top:1px solid var(--border);margin-top:14px;padding-top:12px">
          <label class="chk" style="font-size:12px;color:var(--text)">
            <input type="checkbox" id="tg-on-alerts" /> <span data-i18n="set.onAlerts"></span>
          </label>
          <div id="tg-events" style="margin-top:10px;display:grid;gap:7px">
            <label class="chk" data-ev="ctrDie"><input type="checkbox" /> <span data-i18n="set.evCtrDie"></span></label>
            <label class="chk" data-ev="thresholds"><input type="checkbox" /> <span data-i18n="set.evThresholds"></span></label>
            <label class="chk" data-ev="connLost"><input type="checkbox" /> <span data-i18n="set.evConnLost"></span></label>
            <label class="chk" data-ev="composeDone"><input type="checkbox" /> <span data-i18n="set.evCompose"></span></label>
          </div>
        </div>
      </div>
      <div class="mfoot"><button data-close="settings-modal" data-i18n="editor.close"></button></div>
    </div>
  </div>

  <!-- шпаргалка по клавішах -->
  <div class="modal-back" id="keys-modal">
    <div class="modal" style="width:460px">
      <div class="mhead"><span data-i18n="welcome.shortcuts"></span> <span class="x" data-icon="x" data-close="keys-modal"></span></div>
      <div class="mbody"><div id="keys-body"></div></div>
    </div>
  </div>

  <!-- рекурсивний пошук файлів -->
  <div class="modal-back" id="find-modal">
    <div class="modal" style="width:70vw;height:74vh">
      <div class="mhead"><span data-i18n="find.title"></span> <span id="find-where" class="hint"></span>
        <span class="x" data-icon="x" data-close="find-modal"></span></div>
      <div class="mbody" style="display:flex;flex-direction:column;gap:0;padding:0">
        <div class="toolbar">
          <input id="find-q" data-i18n-ph="find.q" style="flex:1" />
          <div class="seg" id="find-mode">
            <button data-m="name" class="on" data-i18n="find.byName"></button>
            <button data-m="content" data-i18n="find.byContent"></button>
          </div>
          <button id="find-go" class="primary" data-icon="search"><span data-i18n="deep.go"></span></button>
        </div>
        <div id="find-stat" class="hint" style="padding:6px 12px"></div>
        <div id="find-results" class="respane"></div>
      </div>
    </div>
  </div>

  <!-- локальні проєкти -->
  <div class="modal-back" id="project-modal">
    <div class="modal" style="width:600px">
      <div class="mhead"><span data-i18n="proj.title"></span> <span class="x" data-icon="x" data-close="project-modal"></span></div>
      <div class="mbody">
        <div class="plist" id="project-list"></div>
        <div style="border-top:1px solid var(--border);padding-top:12px">
          <div style="font-weight:600;margin-bottom:10px" id="pj-title"></div>
          <div class="form-grid">
            <label data-i18n="proj.path"></label><input id="pj-path" class="mono-input" placeholder="E:\work\myapp" />
            <label data-i18n="conn.name"></label><input id="pj-name" data-i18n-ph="proj.nameHint" />
          </div>
          <div class="hint" style="margin-top:8px" data-i18n="proj.hint"></div>
        </div>
      </div>
      <div class="mfoot">
        <button data-close="project-modal" data-i18n="conn.cancel"></button>
        <button id="pj-save" class="primary" data-i18n="conn.save"></button>
      </div>
    </div>
  </div>

  <div id="toast-wrap"></div>
