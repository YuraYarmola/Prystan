name: Release

# Збірка під усі платформи запускається трьома способами:
#   1. коміт у main зі словом [release] у повідомленні — версія береться з Cargo.toml
#   2. пуш теґа vX.Y.Z
#   3. вручну з вкладки Actions
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Створити чернетку релізу (інакше лише зібрати артефакти)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Лише офіційні actions: rust ставиться передвстановленим rustup,
# реліз створюється передвстановленим gh CLI.

jobs:
  # Вирішує, чи взагалі щось збирати, і під якою версією
  decide:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.d.outputs.build }}
      publish: ${{ steps.d.outputs.publish }}
      version: ${{ steps.d.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: d
        shell: bash
        run: |
          # версія з Cargo.toml — єдине джерело правди
          cargo_ver=$(grep -m1 '^version' app/src-tauri/Cargo.toml | cut -d'"' -f2)

          build=false
          publish=false
          version="v$cargo_ver"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            build=true; publish=true; version="${{ github.ref_name }}"
            echo "Теґ ${version} — збираємо й публікуємо"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            build=true; publish="${{ inputs.publish }}"
            echo "Ручний запуск, публікація: $publish"
          else
            msg=$(git log -1 --pretty=%B)
            if grep -qiE '\[(release|build)\]' <<< "$msg"; then
              build=true; publish=true
              echo "Маркер [release] у коміті — збираємо версію ${version} з Cargo.toml"
            else
              echo "Звичайний коміт без маркера — релізна збірка пропускається"
              echo "(додайте [release] у повідомлення коміту, щоб зібрати)"
            fi
          fi

          {
            echo "build=$build"
            echo "publish=$publish"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # Не даємо мовчки перезаписати вже випущену версію
      - name: Check version is not released yet
        if: steps.d.outputs.publish == 'true' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.d.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Реліз ${{ steps.d.outputs.version }} вже існує. Підніміть version у app/src-tauri/Cargo.toml."
            exit 1
          fi

  build:
    name: ${{ matrix.label }}
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/src-tauri

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: prystan.exe
            archive: zip
            test: true

          - label: Windows x86 (32-bit)
            os: windows-latest
            target: i686-pc-windows-msvc
            bin: prystan.exe
            archive: zip
            test: false

          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bin: prystan.exe
            archive: zip
            test: false

          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bin: prystan
            archive: tar
            test: true

          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bin: prystan
            archive: tar
            test: false

          - label: Linux x64 (Ubuntu)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin: prystan
            archive: tar
            test: true

    steps:
      - uses: actions/checkout@v4

      # Tauri на Linux будується поверх WebKitGTK — без цих пакетів не злінкується
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf file

      - name: Set up Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # Тести лише на нативних цілях — крос-збірку раннер не запустить
      - name: Unit tests
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "prystan-${{ needs.decide.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "../../dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "../../dist/$name/"
          Copy-Item "../../README.md","../../LICENSE","../../CHANGELOG.md" "../../dist/$name/"
          Compress-Archive -Path "../../dist/$name/*" -DestinationPath "../../dist/$name.zip"
          Remove-Item -Recurse -Force "../../dist/$name"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        run: |
          name="prystan-${{ needs.decide.outputs.version }}-${{ matrix.target }}"
          mkdir -p "../../dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "../../dist/$name/"
          chmod +x "../../dist/$name/${{ matrix.bin }}"
          cp ../../README.md ../../LICENSE ../../CHANGELOG.md "../../dist/$name/"
          tar -czf "../../dist/$name.tar.gz" -C "../../dist" "$name"
          rm -rf "../../dist/$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prystan-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish draft release
    needs: [decide, build]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lah dist/

      - name: Compose release notes
        run: |
          cat > notes.md <<'NOTES'
          Портативні збірки — розпакуйте й запускайте, інсталятор не потрібен.

          ### Який файл завантажити

          | Ваша система | Файл |
          |---|---|
          | Windows 10/11, 64-біт (майже всі ПК) | `…-x86_64-pc-windows-msvc.zip` |
          | Windows на ARM (Surface Pro X, Dev Kit) | `…-aarch64-pc-windows-msvc.zip` |
          | Windows 32-біт (старі машини) | `…-i686-pc-windows-msvc.zip` |
          | Mac на Apple Silicon (M1–M4) | `…-aarch64-apple-darwin.tar.gz` |
          | Mac на Intel (до 2020) | `…-x86_64-apple-darwin.tar.gz` |
          | Linux, 64-біт | `…-x86_64-unknown-linux-gnu.tar.gz` |

          Не знаєте, який у вас Mac? Меню  → «Про цей Mac»: якщо чип називається
          M1/M2/M3/M4 — беріть Apple Silicon, якщо Intel — Intel.

          ### Після завантаження

          **Windows:** потрібен [WebView2](https://developer.microsoft.com/microsoft-edge/webview2/) — є в Windows 11 і в оновленій Windows 10.
          **macOS:** збірки не підписані. При першому запуску `Ctrl`+клік → «Відкрити», або `xattr -dr com.apple.quarantine prystan`.
          **Linux:** потрібні `libwebkit2gtk-4.1-0` і `libgtk-3-0`.

          Повний список змін — у [CHANGELOG.md](CHANGELOG.md).
          NOTES

      # gh CLI передвстановлений на раннерах; теґ створюється разом із релізом
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.decide.outputs.version }}" dist/* \
            --draft \
            --target "${{ github.sha }}" \
            --title "Prystan ${{ needs.decide.outputs.version }}" \
            --notes-file notes.md
          echo "Чернетку створено: ${{ needs.decide.outputs.version }}"
          echo "Перевірте й опублікуйте на вкладці Releases."
