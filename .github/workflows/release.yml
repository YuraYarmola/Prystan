name: Release

# Збірка під усі платформи запускається трьома способами:
#   1. коміт у main зі словом [release] у повідомленні — версія береться з Cargo.toml
#   2. пуш теґа vX.Y.Z
#   3. вручну з вкладки Actions
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Опублікувати реліз (інакше лише зібрати артефакти)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Умова запуску обчислюється керуючим шаром GitHub, без окремої джоби-воротаря:
# зайва джоба означала б ще один раннер, який може не отримати виконавця
# і завалити всю матрицю (саме так і сталося під час аутейджу Actions).

jobs:
  build:
    name: ${{ matrix.label }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/src-tauri

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            pretty: Windows-x64
            bin: prystan.exe
            archive: zip
            test: true

          - label: Windows x86 (32-bit)
            os: windows-latest
            target: i686-pc-windows-msvc
            pretty: Windows-32bit
            bin: prystan.exe
            archive: zip
            test: false

          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            pretty: Windows-ARM64
            bin: prystan.exe
            archive: zip
            test: false

          - label: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            pretty: macOS-AppleSilicon
            bin: prystan
            archive: tar
            test: true

          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            pretty: macOS-Intel
            bin: prystan
            archive: tar
            test: false

          - label: Linux x64 (Ubuntu)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pretty: Linux-x64
            bin: prystan
            archive: tar
            test: true

    steps:
      - uses: actions/checkout@v4

      # Версія: з теґа, якщо він є, інакше з Cargo.toml
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            v="${{ github.ref_name }}"
          else
            v="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Версія збірки: $v"

      # Tauri на Linux будується поверх WebKitGTK — без цих пакетів не злінкується
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf file

      - name: Set up Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # Тести лише на нативних цілях — крос-збірку раннер не запустить
      - name: Unit tests
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "Prystan-${{ steps.ver.outputs.value }}-${{ matrix.pretty }}"
          New-Item -ItemType Directory -Force -Path "../../dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "../../dist/$name/"
          Copy-Item "../../README.md","../../LICENSE","../../CHANGELOG.md" "../../dist/$name/"
          Compress-Archive -Path "../../dist/$name/*" -DestinationPath "../../dist/$name.zip"
          Remove-Item -Recurse -Force "../../dist/$name"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        run: |
          name="Prystan-${{ steps.ver.outputs.value }}-${{ matrix.pretty }}"
          mkdir -p "../../dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "../../dist/$name/"
          chmod +x "../../dist/$name/${{ matrix.bin }}"
          cp ../../README.md ../../LICENSE ../../CHANGELOG.md "../../dist/$name/"
          tar -czf "../../dist/$name.tar.gz" -C "../../dist" "$name"
          rm -rf "../../dist/$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pretty }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    # На ручному запуску реліз створюємо лише якщо явно попросили
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            v="${{ github.ref_name }}"
          else
            v="v$(grep -m1 '^version' app/src-tauri/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      # Не даємо мовчки перезаписати вже випущену версію
      - name: Check version is not released yet
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.value }}" >/dev/null 2>&1; then
            echo "::error::Реліз ${{ steps.ver.outputs.value }} вже існує. Підніміть version у app/src-tauri/Cargo.toml."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lah dist/

      - name: Compose release notes
        run: |
          cat > notes.md <<'NOTES'
          Портативні збірки — розпакуйте й запускайте, інсталятор не потрібен.

          ### Який файл завантажити

          | Ваша система | Файл |
          |---|---|
          | **Windows 10/11 — майже всі ПК** | `Prystan-…-Windows-x64.zip` |
          | Windows на ARM (Surface Pro X, Dev Kit) | `Prystan-…-Windows-ARM64.zip` |
          | Windows 32-біт (старі машини) | `Prystan-…-Windows-32bit.zip` |
          | **Mac на Apple Silicon (M1–M4)** | `Prystan-…-macOS-AppleSilicon.tar.gz` |
          | Mac на Intel (до 2020) | `Prystan-…-macOS-Intel.tar.gz` |
          | **Linux, 64-біт** | `Prystan-…-Linux-x64.tar.gz` |

          Якщо не впевнені — беріть **Windows-x64**: він підходить майже всім.
          ARM-версія на звичайному ПК просто не запуститься.

          Не знаєте, який у вас Mac? Меню  → «Про цей Mac»: чип M1/M2/M3/M4 —
          беріть Apple Silicon, напис Intel — відповідно Intel.

          ### Після завантаження

          **Windows:** потрібен [WebView2](https://developer.microsoft.com/microsoft-edge/webview2/) — є в Windows 11 і в оновленій Windows 10.
          **macOS:** збірки не підписані. При першому запуску `Ctrl`+клік → «Відкрити», або `xattr -dr com.apple.quarantine prystan`.
          **Linux:** потрібні `libwebkit2gtk-4.1-0` і `libgtk-3-0`.

          Повний список змін — у [CHANGELOG.md](CHANGELOG.md).
          NOTES

      # gh CLI передвстановлений на раннерах; теґ створюється разом із релізом.
      # Реліз публікується одразу й позначається як Latest — саме його бачить
      # людина, що заходить на сторінку проєкту, і на нього вказує кнопка
      # завантаження. Чернетку довелося б відкривати й публікувати руками,
      # а до того моменту користувачі бачили б попередню версію.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.value }}" dist/* \
            --latest \
            --target "${{ github.sha }}" \
            --title "Prystan ${{ steps.ver.outputs.value }}" \
            --notes-file notes.md
          echo "Реліз ${{ steps.ver.outputs.value }} опубліковано як Latest."
