name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Змінам із форків не потрібні жодні секрети — читання достатньо.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Свідомо використовуємо лише офіційні actions (checkout / cache / artifact).
# Rust ставимо через rustup, який уже є на всіх раннерах: одна зовнішня
# залежність менше, і збірка не падає, коли marketplace недоступний.

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: win-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: win-cargo-

      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Unit tests
        run: cargo test --verbose

      - name: Release build
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: prystan-windows-x64
          path: app/src-tauri/target/release/prystan.exe
          if-no-files-found: error
          retention-days: 14

  # Ловить платформо-залежні поломки ще на PR, не чекаючи релізу
  cross-platform:
    name: Compile check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/src-tauri
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf file

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test
